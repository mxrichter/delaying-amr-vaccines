  0.026995483256594, 0.00876415024678427, 0.002215924205969]
  
vaccination_strategies:
- id: age
  name: "Age-based"
  doses:
    initial: 
      age: 0.75 # targetAge
    booster:
      age: 2.25 # targetAge
  booster_conditional: yes
- id: seasonal
  name: "Seasonal"
  doses:
    initial:
      age: [0.6667, 1.6667] # [minAge, maxAge]
    booster:
      age: [1.6667, 2.6667] # [minAge, maxAge]
  booster_conditional: yes
    
vaccine:
  efficacy: [0.91, 0.49]
  half_life: 0.61
  k_decay: 0.69
  resistance_scaler: 1

ar_mkr_sensitive: 27.6
lf_sensitive_level: 0.032

seasonality: "perennial" # see seasonality_profiles

vaccine_deployment: "age" # see vaccination_strategies

lhc_outcomes: ["selection_coefficient"]

