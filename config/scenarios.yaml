population_size: 25000

timestep: 30 # in days

init_date: "1990-01-01"

# Length of burn-in period
burn_in: 30 # in years

# Length of simulation in years
sim_duration: 35

# Lead time of deployment in years
lead_time: 15

# Prevalence of resistant genotype after burn-in
prevalence_resistant: 0.5

# Length of parasite generation for calculation of selection coefficient
parasite_generation: 60

# Cohort structure in analysis
cohorts:
  include: no
  tracking: "vaccine"
  begin_recruitment: 0.0833 # in years, 0.0833 = 1 month
  max_time: 1.0 # in years
  
age_groups: [] # [0, ..., 99]   

resistance_scenarios: ""
eir_filter: ""

seasonality_profiles:
- id: perennial
  pattern: "vector"
  values: [0.1]
- id: seasonal1
  pattern: "vector"
  values: [0.00876415024678427, 0.026995483256594, 0.0647587978329459, 
  0.120985362259572, 0.17603266338215, 0.199471140200716, 
